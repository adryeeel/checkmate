name: CD

on:
    push:
        branches: [master]
    workflow_dispatch:

concurrency:
    group: cd-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                service: [web]

        steps:
            - name: Set up code
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Authenticate to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: ./.github/actions/build-push
              with:
                  name: ${{ matrix.service }}

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest

        steps:
            - name: Set up code
              uses: actions/checkout@v7

            - name: Copy Docker compose file to VPS
              uses: ./.github/actions/copy-compose
              with:
                  project: checkmate
                  key: ${{ secrets.VPS_SSH_KEY }}
                  host: ${{ secrets.VPS_SSH_HOST }}
                  port: ${{ secrets.VPS_SSH_PORT }}
                  username: ${{ vars.VPS_SSH_USERNAME }}

            - name: Deploy service to VPS
              uses: ./.github/actions/vps-deploy
              with:
                  project: checkmate
                  key: ${{ secrets.VPS_SSH_KEY }}
                  host: ${{ secrets.VPS_SSH_HOST }}
                  port: ${{ secrets.VPS_SSH_PORT }}
                  username: ${{ vars.VPS_SSH_USERNAME }}
                  ghcr_token: ${{ secrets.GHCR_TOKEN }}
