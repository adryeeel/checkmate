name: VPS Deploy
description: Deploy a service to a VPS using SSH and Docker Compose.

inputs:
    host:
        description: VPS host address.
        required: true

    key:
        description: SSH private key for authentication.
        required: true

    username:
        description: SSH username for login.
        required: true

    ghcr_token:
        description: GHCR token for authentication.
        required: true

runs:
    using: composite
    steps:
        - uses: appleboy/ssh-action@v1.2.5
          with:
              key: ${{ inputs.key }}
              host: ${{ inputs.host }}
              username: ${{ inputs.username }}

              script: |
                  cd /home/${{ inputs.username }}/checkmate

                  echo "${{ inputs.ghcr_token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

                  docker compose pull
                  docker compose up -d
                  docker image prune -f
