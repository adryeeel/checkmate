name: CI Setup
description: Set up the environment for CI workflow

runs:
    using: composite
    steps:
        - name: Set up Node.js
          uses: actions/setup-node@v7
          with:
              node-version: lts/*

        - name: Set up PNPM
          uses: pnpm/action-setup@v6
          with:
              cache: true

        - name: Set up dependencies
          run: pnpm install --frozen-lockfile
          shell: bash
