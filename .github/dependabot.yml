version: 2

updates:
    - package-ecosystem: 'github-actions'
      directory: '/'

      schedule:
          interval: 'weekly'

      cooldown:
          default-days: 3

      commit-message:
          prefix: 'build'

      groups:
          github-actions:
              patterns:
                  - '*'

    - package-ecosystem: 'npm'
      directory: '/'

      schedule:
          interval: 'weekly'

      cooldown:
          default-days: 3

      commit-message:
          prefix: 'build'

      groups:
          production:
              dependency-type: 'production'

          development:
              dependency-type: 'development'

    - package-ecosystem: 'docker'
      directory: '/'

      schedule:
          interval: 'weekly'

      cooldown:
          default-days: 3

      commit-message:
          prefix: 'build'
