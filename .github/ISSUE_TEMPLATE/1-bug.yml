name: Bug Report
description: Reproducible defect report for contributors and AI agents
title: '[bug]: '
labels: ['bug', 'triage']

body:
    - type: markdown
      attributes:
          value: Provide enough information to reproduce and validate the issue.

    - type: input
      id: jira
      attributes:
          label: Jira Reference
          description: Link or key of the Jira story
          placeholder: CM-101
      validations:
          required: true

    - type: textarea
      id: summary
      attributes:
          label: Summary
          description: Short description of the issue
          placeholder: Login fails when using GitHub OAuth callback
      validations:
          required: true

    - type: textarea
      id: steps_to_reproduce
      attributes:
          label: Steps to Reproduce
          description: Exact steps to reproduce the issue
          value: |
              1.
              2.
              3.
      validations:
          required: true

    - type: textarea
      id: expected_behavior
      attributes:
          label: Expected Behavior
          description: What should have happened
          placeholder: User should be authenticated and redirected to dashboard
      validations:
          required: true

    - type: textarea
      id: actual_behavior
      attributes:
          label: Actual Behavior
          description: What actually happened
          placeholder: OAuth callback returns 500 error
      validations:
          required: true

    - type: textarea
      id: environment
      attributes:
          label: Environment
          description: Runtime context where issue occurs
          value: |
              - OS:
              - Browser:
              - Device:
              - App version:
              - Environment (dev/staging/prod):
      validations:
          required: true

    - type: textarea
      id: logs
      attributes:
          label: Logs / Errors
          description: Relevant logs, stack traces, or error messages
          render: shell

    - type: textarea
      id: evidence
      attributes:
          label: Evidence
          description: Screenshots, recordings, or additional diagnostic info

    - type: textarea
      id: notes
      attributes:
          label: Additional Notes
          description: Edge cases, frequency, suspected cause, related issues
