name: DevOps
description: CI/CD, deployment or observability issues
title: '[devops]: '
labels: ['devops', 'triage']

body:
    - type: markdown
      attributes:
          value: Describe changes to development, delivery, monitoring or operational processes.

    - type: dropdown
      id: concern
      attributes:
          label: Operational Concern
          options:
              - Integration
              - Delivery
              - Monitoring
              - Automation
              - Other
      validations:
          required: true
          multiple: true

    - type: textarea
      id: summary
      attributes:
          label: Summary
          description: What operational change is required?
          placeholder:
      validations:
          required: true

    - type: textarea
      id: current_state
      attributes:
          label: Current State
          description: How the system is currently behaving
          placeholder: |
              -
              -
              -
      validations:
          required: true

    - type: textarea
      id: desired_state
      attributes:
          label: Desired State
          description: Target operational setup
          placeholder: |
              -
              -
              -
      validations:
          required: true

    - type: textarea
      id: scope
      attributes:
          label: Scope
          description: Explicit boundaries of the change
          value: |
              Included:
              - 

              Excluded:
              -
      validations:
          required: true

    - type: dropdown
      id: environment
      attributes:
          label: Environment
          options:
              - Development
              - Staging
              - Production
              - CI/CD
      validations:
          required: true
          multiple: true

    - type: dropdown
      id: risk
      attributes:
          label: Risk Level
          options:
              - Low (non-production / internal tooling)
              - Medium (staging / production impact)
              - High (security breach / downtime risk)
      validations:
          required: true
