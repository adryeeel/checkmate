services:
    cm-web:
        image: ghcr.io/${GITHUB_REPOSITORY}/web:latest
        container_name: cm-web
        restart: unless-stopped

        env_file:
            - .env

        networks:
            - proxy

        logging:
            driver: json-file
            options:
                max-file: 3
                max-size: 10m

        mem_limit: 512m

networks:
    proxy:
